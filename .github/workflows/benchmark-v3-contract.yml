name: benchmark-v3-contract

on:
  pull_request:
    paths:
      - "scripts/generate_long_trajectory_benchmark_v3.py"
      - "scripts/validate_long_trajectory_benchmark_v3.py"
      - "scripts/run_long_checkpoint_e2e_v3.cjs"
      - "scripts/check_benchmark_v3_contract.py"
      - "scripts/validate_benchmark_v3_oracle_runner.cjs"
      - "tests/benchmark_v3_metrics.cjs"
      - "docs/benchmark-v3.md"
      - ".github/workflows/benchmark-v3-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/generate_long_trajectory_benchmark_v3.py"
      - "scripts/validate_long_trajectory_benchmark_v3.py"
      - "scripts/run_long_checkpoint_e2e_v3.cjs"
      - "scripts/check_benchmark_v3_contract.py"
      - "tests/benchmark_v3_metrics.cjs"
      - "docs/benchmark-v3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax
        run: |
          python -m py_compile scripts/generate_long_trajectory_benchmark_v3.py scripts/validate_long_trajectory_benchmark_v3.py
          node --check scripts/run_long_checkpoint_e2e_v3.cjs
          node --check tests/benchmark_v3_metrics.cjs
          node --check scripts/validate_benchmark_v3_oracle_runner.cjs
      - name: Generate frozen-shape V3 corpus
        run: python scripts/generate_long_trajectory_benchmark_v3.py --count 180 --out /tmp/long_trajectories_v3.json
      - name: Validate split isolation, oracle integrity and coverage
        run: python scripts/validate_long_trajectory_benchmark_v3.py /tmp/long_trajectories_v3.json
      - name: Prove gold oracle is executable by canonical stateful runner
        run: node scripts/validate_benchmark_v3_oracle_runner.cjs /tmp/long_trajectories_v3.json
      - name: Validate stratified evaluator metrics
        run: node tests/benchmark_v3_metrics.cjs
      - name: Reproducibility
        run: |
          python scripts/generate_long_trajectory_benchmark_v3.py --count 180 --out /tmp/long_trajectories_v3_again.json
          cmp /tmp/long_trajectories_v3.json /tmp/long_trajectories_v3_again.json
