name: reasoning-backend-contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reasoning and physical-world contracts
        run: python -m pytest -q tests/test_reasoning_backend_contract.py tests/test_physical_world_benchmark.py
      - name: Build 46-model benchmark manifest
        run: python scripts/build_physical_world_benchmark.py --per-model 10 --output artifacts/physical-world-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: physical-world-benchmark
          path: artifacts/physical-world-benchmark.json
