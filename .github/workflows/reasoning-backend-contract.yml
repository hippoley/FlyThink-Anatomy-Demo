name: reasoning-backend-contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Build immutable capability index
        run: python scripts/build_capability_index.py
      - name: Validate reasoning and physical-world contracts
        run: python -m pytest -q tests/test_reasoning_backend_contract.py tests/test_physical_world_benchmark.py tests/test_multiturn_episode_generation.py tests/test_whole_home_patch_corpus.py tests/test_flywire_whole_home_patch.py
      - name: Build frozen whole-home patch acceptance
        run: python scripts/whole_home_patch_corpus.py --output artifacts/whole-home-patch-acceptance.json
      - name: Build 46-model benchmark manifest
        run: python scripts/build_physical_world_benchmark.py --per-model 10 --output artifacts/physical-world-benchmark.json
      - name: Build stateful multi-turn episodes
        run: python scripts/build_multiturn_episodes.py --manifest artifacts/physical-world-benchmark.json --output artifacts/multiturn-episodes.json
      - uses: actions/upload-artifact@v4
        with:
          name: physical-world-benchmark
          path: |
            artifacts/whole-home-patch-acceptance.json
            artifacts/physical-world-benchmark.json
            artifacts/multiturn-episodes.json
