name: flywire-whole-home-training-v2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/train_flywire_whole_home_patch_v2.py"
      - "scripts/whole_home_patch_corpus_v2.py"
      - ".github/workflows/flywire-whole-home-training-v2.yml"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Train real and independently disconnected models
        run: python scripts/train_flywire_whole_home_patch_v2.py --epochs 160
      - run: cat artifacts/flywire-whole-home-v2/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-whole-home-training-v2
          path: artifacts/flywire-whole-home-v2/
