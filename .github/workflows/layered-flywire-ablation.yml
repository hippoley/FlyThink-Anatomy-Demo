name: layered-flywire-ablation
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/contextual_state_transition_corpus_v1.py
      - scripts/layered_training_data.py
      - scripts/responsibility_heads.py
      - scripts/responsibility_loss.py
      - scripts/responsibility_labels.py
      - scripts/resolution_gold.py
      - scripts/test_layered_training_data.py
      - scripts/test_resolution_membership.py
      - scripts/test_resolution_gold.py
      - scripts/train_layered_flywire_ablation.py
          scripts/prepare_flywire_graph.py
          scripts/test_layered_training_data.py
          scripts/test_resolution_membership.py
      - scripts/layered_flywire.py
      - scripts/flywire_encoder.py
      - .github/workflows/layered-flywire-ablation.yml

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile experiment sources
        run: >
          python -m py_compile
          scripts/contextual_state_transition_corpus_v1.py
          scripts/layered_dataset.py
          scripts/layered_training_data.py
          scripts/train_layered_flywire_ablation.py
      - name: Install PyTorch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Validate corpus contract
        run: python scripts/test_contextual_state_transition_corpus_v1.py
      - name: Audit split coverage
        run: python scripts/audit_layered_coverage.py
      - name: Validate layered label encoding
        run: python scripts/test_layered_training_data.py
      - name: Validate selected-target vs write-set gold
        run: python scripts/test_resolution_gold.py
      - name: Validate ONE/SET resolver loss
        run: python scripts/test_resolution_membership.py
      - name: Download verified FlyWire graph
        run: python scripts/prepare_flywire_graph.py --download --neurons 512 --out artifacts/flywire
      - name: Run paired-seed A/B/C ablation
        run: python scripts/train_layered_flywire_ablation.py --graph artifacts/flywire/connectome.json --epochs 120
      - name: Show report
        run: cat artifacts/layered-ablation/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: layered-flywire-ablation
          path: artifacts/layered-ablation/
