name: context-judgement-training-v3
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/generate_long_trajectory_benchmark_v3.py"
      - "scripts/benchmark_v3_training_adapter.py"
      - "scripts/context_judgement_corpus_v3.py"
      - "scripts/context_judgement_corpus_v4.py"
      - "tests/test_benchmark_v3_training_adapter.py"
      - "scripts/train_context_judgement_v3.py"
      - ".github/workflows/context-judgement-training-v3.yml"
  push:
    paths:
      - "scripts/generate_long_trajectory_benchmark_v3.py"
      - "scripts/benchmark_v3_training_adapter.py"
      - "scripts/context_judgement_corpus_v3.py"
      - "scripts/context_judgement_corpus_v4.py"
      - "tests/test_benchmark_v3_training_adapter.py"
      - "scripts/train_context_judgement_v3.py"
      - ".github/workflows/context-judgement-training-v3.yml"
jobs:
 train:
  runs-on: ubuntu-latest
  timeout-minutes: 25
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - name: Validate V3.2 training adapter
     run: python tests/test_benchmark_v3_training_adapter.py
   - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
   - run: python scripts/train_context_judgement_v3.py --epochs 400
   - run: cat artifacts/context-judgement-v3/report.json

   - uses: actions/upload-artifact@v4
     with:
      name: context-judgement-v3
      path: artifacts/context-judgement-v3/
