name: flywire-patch-experts-v1
on:
  workflow_dispatch:
  push:
    paths: ["scripts/train_flywire_patch_experts.py",".github/workflows/flywire-patch-experts-v1.yml"]
jobs:
 train:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: python -m py_compile scripts/train_flywire_patch_experts.py
   - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
   - run: python scripts/train_flywire_patch_experts.py --epochs 500
   - run: cat artifacts/flywire-patch-experts-v1/report.json
   - uses: actions/upload-artifact@v4
     with: {name: flywire-patch-experts-v1, path: artifacts/flywire-patch-experts-v1/}
