name: resolution-contrast-v2
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/contextual_state_transition_corpus_v2.py
      - scripts/layered_dataset.py
      - scripts/layered_training_data.py
      - scripts/layered_flywire.py
      - scripts/flywire_encoder.py
      - scripts/responsibility_heads.py
      - scripts/test_compositional_resolution.py
      - scripts/test_contextual_state_transition_corpus_v2.py
      - scripts/test_resolution_contrast_loss.py
      - scripts/test_resolution_membership.py
      - scripts/responsibility_loss.py
      - scripts/resolution_gold.py
      - scripts/resolution_contrast_loss.py
      - scripts/train_resolution_contrast_v2.py
      - .github/workflows/resolution-contrast-v2.yml
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/contextual_state_transition_corpus_v2.py scripts/layered_dataset.py scripts/layered_training_data.py scripts/layered_flywire.py scripts/resolution_contrast_loss.py scripts/train_resolution_contrast_v2.py scripts/test_contextual_state_transition_corpus_v2.py scripts/test_resolution_contrast_loss.py scripts/test_resolution_membership.py scripts/test_compositional_resolution.py
      - name: Install PyTorch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Validate V2 corpus
        run: python scripts/test_contextual_state_transition_corpus_v2.py
      - name: Validate contrast gradient
        run: python scripts/test_resolution_contrast_loss.py
      - name: Validate ONE/SET
        run: python scripts/test_resolution_membership.py
      - name: Validate compositional SET resolution
        run: python scripts/test_compositional_resolution.py
      - name: Prepare verified FlyWire graph
        run: python scripts/prepare_flywire_graph.py --download --neurons 512 --out artifacts/flywire
      - name: Run paired baseline vs contrast
        run: python scripts/train_resolution_contrast_v2.py --graph artifacts/flywire/connectome.json --epochs 120
      - name: Show report
        run: cat artifacts/resolution-contrast-v2/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: resolution-contrast-v2
          path: artifacts/resolution-contrast-v2/
