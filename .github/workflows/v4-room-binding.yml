name: v4-room-binding
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/contextual_state_transition_corpus_v4.py
      - scripts/test_contextual_state_transition_corpus_v4.py
      - scripts/layered_dataset.py
      - scripts/train_v3_flat_vs_compositional.py
      - .github/workflows/v4-room-binding.yml
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V4
        run: python -m py_compile scripts/contextual_state_transition_corpus_v4.py scripts/test_contextual_state_transition_corpus_v4.py scripts/layered_dataset.py scripts/train_v3_flat_vs_compositional.py
      - name: Install PyTorch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Validate V4 causal contract
        run: python scripts/test_contextual_state_transition_corpus_v4.py
      - name: Prepare verified FlyWire graph
        run: python scripts/prepare_flywire_graph.py --download --neurons 512 --out artifacts/flywire
      - name: Run V4 paired experiment
        run: python scripts/train_v3_flat_vs_compositional.py --dataset v4 --graph artifacts/flywire/connectome.json --epochs 120 --out artifacts/v4-room-binding
      - name: Show V4 report
        run: cat artifacts/v4-room-binding/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-room-binding
          path: artifacts/v4-room-binding/
