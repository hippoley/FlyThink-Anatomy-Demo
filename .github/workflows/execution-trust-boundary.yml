name: Semantic Execution Trust Boundary

on:
  push:
    branches: [main]
    paths:
      - "scripts/authorized_patch_planner.py"
      - "scripts/device_registry.py"
      - "scripts/semantic_capability_map.py"
      - "scripts/atomic_authorized_commit.cjs"
      - "scripts/atomic_physical_set.cjs"
      - "scripts/authorization_ledger.cjs"
      - "scripts/physical_driver_capabilities.cjs"
      - "scripts/physical_transaction_router.cjs"
      - "scripts/physical_runtime.cjs"
      - "scripts/flythink_execution_runtime.cjs"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/execution_receipt.cjs"
      - "scripts/execution_reasoning_contract.cjs"
      - "scripts/whole_home_patch_contract.cjs"
      - "scripts/test_execution_trust_boundary.py"
      - "scripts/test_atomic_physical_set.cjs"
      - "scripts/test_authorization_ledger.cjs"
      - "scripts/test_physical_transaction_router.cjs"
      - "scripts/test_production_physical_turn_atomicity.cjs"
      - "tests/flythink_execution_runtime.cjs"
      - "tests/streaming_execution_runtime_adoption.cjs"
      - "tests/execution_receipt.cjs"
      - ".github/workflows/execution-trust-boundary.yml"
      - "benchmarks/execution_reasoning_contract_cases.json"
      - "tests/execution_reasoning_contract.cjs"
  pull_request:
    paths:
      - "scripts/authorized_patch_planner.py"
      - "scripts/device_registry.py"
      - "scripts/semantic_capability_map.py"
      - "scripts/atomic_authorized_commit.cjs"
      - "scripts/atomic_physical_set.cjs"
      - "scripts/authorization_ledger.cjs"
      - "scripts/physical_driver_capabilities.cjs"
      - "scripts/physical_transaction_router.cjs"
      - "scripts/physical_runtime.cjs"
      - "scripts/flythink_execution_runtime.cjs"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/execution_receipt.cjs"
      - "scripts/execution_reasoning_contract.cjs"
      - "scripts/whole_home_patch_contract.cjs"
      - "scripts/test_execution_trust_boundary.py"
      - "scripts/test_atomic_physical_set.cjs"
      - "scripts/test_authorization_ledger.cjs"
      - "scripts/test_physical_transaction_router.cjs"
      - "scripts/test_production_physical_turn_atomicity.cjs"
      - "tests/flythink_execution_runtime.cjs"
      - "tests/streaming_execution_runtime_adoption.cjs"
      - "tests/execution_receipt.cjs"
      - ".github/workflows/execution-trust-boundary.yml"
      - "benchmarks/execution_reasoning_contract_cases.json"
      - "tests/execution_reasoning_contract.cjs"
  workflow_dispatch:

jobs:
  trust-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax preflight
        run: |
          python -m py_compile scripts/authorized_patch_planner.py scripts/device_registry.py scripts/test_execution_trust_boundary.py
          node --check scripts/atomic_authorized_commit.cjs
          node --check scripts/atomic_physical_set.cjs
          node --check scripts/authorization_ledger.cjs
          node --check scripts/physical_driver_capabilities.cjs
          node --check scripts/physical_transaction_router.cjs
          node --check scripts/physical_runtime.cjs
          node --check scripts/execution_reasoning_contract.cjs
          node --check scripts/flythink_execution_runtime.cjs
          node --check scripts/execution_receipt.cjs
          node --check tests/flythink_execution_runtime.cjs
          node --check tests/streaming_execution_runtime_adoption.cjs
          node --check tests/execution_receipt.cjs
          node --check tests/execution_reasoning_contract.cjs
          node --check scripts/test_atomic_physical_set.cjs
          node --check scripts/test_authorization_ledger.cjs
          node --check scripts/test_physical_transaction_router.cjs
          node --check scripts/test_production_physical_turn_atomicity.cjs
      - name: Prove planner-to-commit safety invariants
        id: planner_commit
        shell: bash
        run: |
          set +e
          python scripts/test_execution_trust_boundary.py > planner-commit.log 2>&1
          status=$?
          cat planner-commit.log
          exit $status
      - name: Upload planner-to-commit failure log
        if: failure() && steps.planner_commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: planner-to-commit-failure
          path: planner-commit.log
          if-no-files-found: error
      - name: Prove durable authorization replay rejection
        run: node scripts/test_authorization_ledger.cjs
      - name: Prove multi-target physical SET cannot degrade to sequential writes
        run: node scripts/test_atomic_physical_set.cjs
      - name: Prove transaction routing preserves SET atomicity
        run: node scripts/test_physical_transaction_router.cjs
      - name: Prove production executor cannot bypass atomic SET routing
        run: node scripts/test_production_physical_turn_atomicity.cjs
      - name: Prove shared execution reasoning contract parity
        run: node tests/execution_reasoning_contract.cjs
      - name: Prove reasoning authorization execution runtime boundary
        run: node tests/flythink_execution_runtime.cjs
      - name: Prove streaming final commit adopts FlyThink execution runtime
        run: node tests/streaming_execution_runtime_adoption.cjs
      - name: Prove execution receipt physical truth integrity
        run: node tests/execution_receipt.cjs
