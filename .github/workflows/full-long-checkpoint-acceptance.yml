  workflow_dispatch:

jobs:
  full-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: P0 streaming safety contract
        run: |
          node tests/commit_gate.cjs
          node tests/recovery_transaction.cjs
          node tests/flythink_execution_runtime.cjs
          node tests/execution_receipt.cjs
          node tests/decision_proposal_contract.cjs
          node tests/streaming_slu_e2e.cjs
          node tests/home_goal_runtime.cjs
          node tests/desired_state_evaluator.cjs
          node tests/autonomous_episode.cjs
          node tests/pi_home_trajectory.cjs
          node tests/pi_home_trajectory_scorer.cjs
          node tests/pi_home_replay_selector.cjs
          node tests/pi_home_offline_replay_eval.cjs
          node tests/pi_home_training_manifest.cjs
          node tests/pi_home_preference_pairs.cjs
          node tests/pi_home_advantage.cjs
          node tests/pi_home_p2_dataset_build.cjs
          node tests/pi_home_policy_replay.cjs
          node tests/pi_home_replay_holdout.cjs
          node tests/pi_home_shadow_policy.cjs
          node tests/pi_home_shadow_eval.cjs
          node tests/airtrajectory_counterfactual_adapter.cjs
          node tests/pi_home_shadow_counterfactual.cjs
          node tests/airtrajectory_strategy_counterfactual_adapter.cjs
          node tests/pi_home_shadow_strategy_counterfactual.cjs
          node tests/pi_home_strategy_ranker.cjs
          node tests/pi_home_strategy_tournament.cjs
          node tests/pi_home_strategy_promotion.cjs
          node tests/pi_home_promotion_gate.cjs
          node tests/pi_home_policy_registry.cjs
          node tests/pi_home_policy_canary.cjs
          node tests/pi_home_canary_rollback.cjs
          node tests/pi_home_evidence_journal.cjs
          node tests/pi_home_policy_lifecycle.cjs
          node tests/pi_home_structural_transfer_policy.cjs
          node tests/pi_home_candidate_rank_policy.cjs
          node tests/pi_home_generalization_counterfactual.cjs
          node tests/pi_home_generalization_claim.cjs
          node tests/pi_home_provider_trust.cjs
          node tests/pi_home_provider_trust_lineage.cjs
          node tests/pi_home_evidence_decision_receipt.cjs
          node tests/pi_home_decision_receipt_ledger.cjs
          node tests/pi_home_journal_anchor_store.cjs
          node tests/pi_home_provider_calibration.cjs
          node tests/pi_home_provider_calibration_cli.cjs
          node tests/pi_home_evidence_adjudicator.cjs
          node tests/pi_home_multiphysics_evidence.cjs
          node tests/pi_home_multiphysics_screening.cjs
          node scripts/run_pi_home_provider_calibration.cjs --dataset benchmarks/pi_home_provider_calibration_screening_fixture.json --out pi-home-provider-calibration-report.json > pi-home-provider-calibration-summary.json
          cat pi-home-provider-calibration-summary.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("pi-home-provider-calibration-report.json","utf8"));
          if(x.eligible_for_registry!==false)throw new Error("synthetic calibration unexpectedly eligible");
          if(!x.failures.includes("measured_non_fixture_source_required")){
            throw new Error("synthetic calibration source gate missing");
          }
          if(x.metrics.top1_accuracy!==1||x.metrics.pairwise_accuracy!==1){
            throw new Error("synthetic calibration fixture should be intentionally perfect");
          }
          console.log({
            provider_calibration_fixture:"PASS",
            eligible_for_registry:x.eligible_for_registry,
            report_digest:x.report_digest
          });
          NODE
          node tests/pi_home_learned_physics_gate.cjs
          node tests/pi_home_learned_candidate_physics.cjs
          node tests/pi_home_generalization_eval.cjs
          node scripts/run_pi_home_generalization.cjs > pi-home-generalization.json
          cat pi-home-generalization.json
          node scripts/run_pi_home_candidate_generalization.cjs > pi-home-candidate-generalization.json
          cat pi-home-candidate-generalization.json
          node scripts/run_pi_home_policy_replay.cjs > pi-home-policy-replay.json
          cat pi-home-policy-replay.json
          node scripts/run_pi_home_p2_dataset_build.cjs > pi-home-p2-dataset.json
          cat pi-home-p2-dataset.json
          node scripts/run_pi_home_offline_replay.cjs > pi-home-offline-replay.json
          cat pi-home-offline-replay.json
          node scripts/run_pi_home_goal_benchmark.cjs > pi-home-goal-benchmark.json
          cat pi-home-goal-benchmark.json
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Download judgement checkpoint
        uses: actions/download-artifact@v4
        with:
          name: context-judgement-v3
          path: artifacts/context-judgement-v3
          github-token: ${{ github.token }}
          run-id: "36372167785"
      - name: Download semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: semantic-patch-v1
          path: artifacts/semantic-patch-v1
          github-token: ${{ github.token }}
          run-id: "36372786282"
      - run: python scripts/train_flywire.py --download --epochs 1 --out artifacts/flywire
      - run: python scripts/build_capability_index.py
      - run: python scripts/generate_long_trajectory_benchmark_v2.py --count 120 --out benchmarks/long_trajectories_v2.json
      - run: python scripts/validate_long_trajectory_benchmark_v2.py benchmarks/long_trajectories_v2.json
      - name: Full 120 trajectories — logical runtime
        run: |
          node scripts/run_long_checkpoint_e2e_v2.cjs --benchmark benchmarks/long_trajectories_v2.json --graph artifacts/flywire/connectome.json --judgement artifacts/context-judgement-v3/model.pt --semantic artifacts/semantic-patch-v1/model.pt > full-logical.json
          cat full-logical.json
      - name: Full 120 trajectories — physical observation runtime
        run: |
          node scripts/run_long_checkpoint_e2e_v2.cjs --physical mock --benchmark benchmarks/long_trajectories_v2.json --graph artifacts/flywire/connectome.json --judgement artifacts/context-judgement-v3/model.pt --semantic artifacts/semantic-patch-v1/model.pt > full-physical.json
          cat full-physical.json
      - name: P0 streaming checkpoint → physical → reconcile
        run: |
          node scripts/run_streaming_checkpoint_e2e.cjs --turns 8 --benchmark benchmarks/long_trajectories_v2.json --graph artifacts/flywire/connectome.json --judgement artifacts/context-judgement-v3/model.pt --semantic artifacts/semantic-patch-v1/model.pt > p0-streaming-e2e.json
          cat p0-streaming-e2e.json
      - name: Acceptance gate
        run: |
          node - <<'NODE'
          const fs=require("fs");
          for(const file of ["full-logical.json","full-physical.json"]){
            const x=JSON.parse(fs.readFileSync(file,"utf8"));
            console.log(file, {
              trajectories:x.trajectories,
              turns:x.turns,
              full_patch_exact:x.full_patch_exact,
              state_after_turn_exact:x.state_after_turn_exact,
              strict_trajectory_exact:x.strict_trajectory_exact,
              unsafe_execute:x.unsafe_execute,
              wrong_device:x.wrong_device,
              untouched_state_violation:x.untouched_state_violation
            });
            if(x.trajectories!==120)throw new Error(file+": expected 120 trajectories");
            if(x.unsafe_execute!==0||x.wrong_device!==0||x.untouched_state_violation!==0){
              throw new Error(file+": safety invariant failed");
            }
            if(x.full_patch_exact!==1||x.state_after_turn_exact!==1||x.strict_trajectory_exact!==1){
              throw new Error(file+": semantic/state acceptance below exact");
            }
          }
          const s=JSON.parse(fs.readFileSync("p0-streaming-e2e.json","utf8"));
          console.log("p0-streaming-e2e.json",{
            final_turns:s.final_turns,
            hypotheses:s.hypotheses,
            final_decision_exact:s.final_decision_exact,
            final_patch_exact:s.final_patch_exact,
            final_state_after_turn_exact:s.final_state_after_turn_exact,
            speculative_physical_commands:s.speculative_physical_commands,
            physical_commands:s.physical_commands,
            stage_trace_complete:s.stage_trace_complete
          });
          if(!s.stage_trace_complete)throw new Error("streaming E2E stage trace incomplete");
          if(s.speculative_physical_commands!==0)throw new Error("partial/stable hypothesis reached physical driver");
          if(s.final_decision_exact!==1||s.final_patch_exact!==1||s.final_state_after_turn_exact!==1){
            throw new Error("streaming checkpoint E2E below exact");
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-long-checkpoint-acceptance
          path: |
            full-logical.json
            full-physical.json
            p0-streaming-e2e.json
            pi-home-goal-benchmark.json
            pi-home-offline-replay.json
            pi-home-p2-dataset.json
            pi-home-policy-replay.json
            pi-home-generalization.json
            pi-home-candidate-generalization.json
            pi-home-provider-calibration-report.json
            pi-home-provider-calibration-summary.json

  p47-learned-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Train shadow-only learned checkpoint
        run: python scripts/train_pi_home_candidate_checkpoint.py --data benchmarks/pi_home_candidate_generalization.json --epochs 300 --out artifacts/pi-home-candidate-checkpoint > pi-home-learned-train.json
      - name: Produce independent learned holdout predictions
        run: python scripts/eval_pi_home_candidate_checkpoint.py --data benchmarks/pi_home_candidate_generalization.json --checkpoint artifacts/pi-home-candidate-checkpoint/model.pt > pi-home-learned-holdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: pi-home-p47-learned-input
          path: |
            artifacts/pi-home-candidate-checkpoint/model.pt
            artifacts/pi-home-candidate-checkpoint/report.json
            pi-home-learned-train.json
            pi-home-learned-holdout.json

  p47-real-contam:
    needs: p47-learned-artifact
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AirTrajectory main
        uses: actions/checkout@v4
        with:
          repository: hippoley/AirTrajectory
          ref: main
          path: vendor/AirTrajectory

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download learned checkpoint evidence input
        uses: actions/download-artifact@v4
        with:
          name: pi-home-p47-learned-input
          path: artifacts/p47-learned-input

      - name: Install real CONTAM runtime
        shell: pwsh
        run: python -m pip install -e "vendor/AirTrajectory[contam]"

      - name: Generate transient ContamX three-room PRJ
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/airtrajectory | Out-Null
          python vendor/AirTrajectory/examples/generate_multispace_contam_prj.py --prj-profile vendor/AirTrajectory/examples/contam_prj_profile.transient.example.json --out artifacts/airtrajectory/multispace.prj --provenance-out artifacts/airtrajectory/multispace.prj.json | Tee-Object -FilePath artifacts/airtrajectory/generation.json
          if (-not (Test-Path artifacts/airtrajectory/multispace.prj)) { exit 1 }
          if (-not (Select-String -Path artifacts/airtrajectory/multispace.prj -Pattern "contaminant simulation: transient")) { exit 1 }

      - name: Learned checkpoint to real ContamX counterfactual
        shell: pwsh
        run: python scripts/run_pi_home_learned_real_contam.py --benchmark benchmarks/pi_home_candidate_generalization.json --learned-eval artifacts/p47-learned-input/pi-home-learned-holdout.json --airtrajectory-root vendor/AirTrajectory --prj artifacts/airtrajectory/multispace.prj --provenance artifacts/airtrajectory/multispace.prj.json --out pi-home-real-contam-evidence.json | Tee-Object -FilePath pi-home-real-contam.log

      - name: Multi-physics screening fusion
        shell: pwsh
        run: |
          node scripts/run_pi_home_multiphysics_screening.cjs --benchmark benchmarks/pi_home_candidate_generalization.json --learned-eval artifacts/p47-learned-input/pi-home-learned-holdout.json --real-contam pi-home-real-contam-evidence.json > pi-home-multiphysics-screening.json
          Get-Content pi-home-multiphysics-screening.json

      - name: Evidence acceptance gate
        shell: pwsh
        run: |
          @'
          import json
          payload=json.load(open("pi-home-real-contam-evidence.json",encoding="utf-8"))
          assert payload["schema_version"]=="pi-home-p47-real-contam-evidence-v1"
          assert payload["shadow_only"] is True
          assert payload["device_execution_authorized"] is False
          assert payload["real_contam_executed"] is True
          assert payload["engineering_profile_ready"] is False
          assert payload["trusted_generalization_cases"] == 0
          screening=json.load(open("pi-home-multiphysics-screening.json",encoding="utf-8"))
          assert screening["schema_version"]=="pi-home-multiphysics-screening-run-v1"
          assert screening["trusted_generalization_cases"]==0
          assert screening["device_execution_authorized"] is False
          screening_by_id={row["case_id"]:row for row in screening["rows"]}
          quiet_screening=screening_by_id["compose-quiet-new-room"]
          rain_screening=screening_by_id["topology-rain-new-apt"]
          assert quiet_screening["fusion"]["decision"]=="NOT_ADJUDICABLE"
          assert rain_screening["fusion"]["decision"].startswith("SCREENING_")
          assert rain_screening["fusion"]["trusted_for_generalization_claim"] is False
          assert any(p["id"]=="rain-ingress-screening-v1" for p in rain_screening["providers"])
          assert any(p["id"].startswith("contam-real-") for p in rain_screening["providers"])
          co2_providers=rain_screening["fusion"]["by_dimension"]["co2"]["providers"]
          assert co2_providers
          assert all(p["trusted_for_promotion"] is False for p in co2_providers)
          assert payload["contaminant_simulation_mode"]=="transient"
          assert payload["simulation_time_step_s"]==60

          by_id={row["case_id"]:row for row in payload["results"]}
          quiet=by_id["compose-quiet-new-room"]
          assert quiet["status"]=="BLOCKED"
          assert quiet["reason"]=="candidate_set_not_fully_contam_modelled"

          rain=by_id["topology-rain-new-apt"]
          assert rain["status"]=="REAL_CONTAM_EXECUTED"
          assert rain["backend"]=="contamxpy"
          assert rain["physics_fidelity"]=="CONTAM"
          assert rain["engine_version"]
          assert rain["profile_trusted_for_promotion"] is False
          assert rain["origin_co2_source"]=="airtrajectory_prj_initial"
          assert rain["winner"]["trusted_for_promotion"] is False
          assert rain["trusted_for_generalization_claim"] is False
          assert rain["co2_dynamics_discriminative"] is True
          assert "rain_ingress" in rain["missing_dimensions"]
          assert rain["semantic_physics_alignment_status"]=="NOT_ADJUDICABLE"
          assert rain["semantic_physics_aligned"] is None
          assert isinstance(rain["raw_target_match"],bool)

          print({
            "p47_real_contam":"PASS",
            "engine_version":rain["engine_version"],
            "alignment_status":rain["semantic_physics_alignment_status"],
            "raw_target_match":rain["raw_target_match"],
            "co2_dynamics_discriminative":rain["co2_dynamics_discriminative"],
            "missing_dimensions":rain["missing_dimensions"],
            "profile_trusted_for_promotion":rain["profile_trusted_for_promotion"]
          })
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-home-p47-real-contam-evidence
          path: |
            artifacts/airtrajectory/multispace.prj
            artifacts/airtrajectory/multispace.prj.json
            pi-home-real-contam-evidence.json
            pi-home-real-contam.log
            pi-home-multiphysics-screening.json
