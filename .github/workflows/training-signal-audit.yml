name: training-signal-audit
on:
  push:
    paths:
      - "scripts/training_objectives.py"
      - "scripts/audit_training_signals.py"
      - "scripts/contextual_state_transition_corpus_v1.py"
      - "scripts/whole_home_patch_corpus_v11.py"
      - ".github/workflows/training-signal-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/training_objectives.py scripts/audit_training_signals.py scripts/contextual_state_transition_corpus_v1.py
      - run: python scripts/test_contextual_state_transition_corpus_v1.py
      - run: python scripts/audit_training_signals.py
