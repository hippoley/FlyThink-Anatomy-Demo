name: reasoning-backend-contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate provider-neutral reasoning contract
        run: python -m pytest -q tests/test_reasoning_backend_contract.py
