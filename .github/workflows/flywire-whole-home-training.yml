name: flywire-whole-home-training

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/train_flywire_whole_home_patch.py"
      - "scripts/whole_home_patch_corpus.py"
      - "artifacts/flywire/connectome.json"
      - ".github/workflows/flywire-whole-home-training.yml"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Train real FlyWire whole-home patch predictor
        run: python scripts/train_flywire_whole_home_patch.py --epochs 120 --out artifacts/flywire-whole-home
      - name: Show evidence report
        run: cat artifacts/flywire-whole-home/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-whole-home-training
          path: |
            artifacts/flywire-whole-home/report.json
            artifacts/flywire-whole-home/v1.pt
