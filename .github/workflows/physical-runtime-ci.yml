name: physical-runtime-ci

env:
  SPATIALRUNTIME_COMMIT_SHA: d123ab9a5310cb9ce15d9e82630828a0d32211f4

on:
  pull_request:
    paths:
      - "scripts/commit_gate.cjs"
      - "scripts/physical_runtime.cjs"
      - "scripts/recovery_transaction.cjs"
      - "scripts/windowpilot_http_driver.cjs"
      - "scripts/runtime_context_adapter.cjs"
      - "scripts/contextual_edge_slu_adapter.cjs"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/stateful_checkpoint_trajectory.cjs"
      - "scripts/probe_windowpilot_checkpoint_e2e.cjs"
      - "scripts/run_acoustic_windowpilot_e2e.cjs"
      - "scripts/live_acoustic_windowpilot.py"
      - "scripts/spatialruntime_authorizer.cjs"
      - "scripts/spatialruntime_window_authorizer.py"
      - "scripts/acoustic_windowpilot_evidence.cjs"
      - "scripts/verify_acoustic_windowpilot_evidence.cjs"
      - "scripts/run_stateful_checkpoint_v1.cjs"
      - "scripts/run_long_checkpoint_e2e_v2.cjs"
      - "tests/commit_gate.cjs"
      - "tests/physical_runtime.cjs"
      - "tests/recovery_transaction.cjs"
      - "tests/runtime_context_adapter.cjs"
      - "tests/contextual_edge_slu_adapter.cjs"
      - "tests/windowpilot_http_driver.cjs"
      - "tests/probe_windowpilot_checkpoint_e2e.cjs"
      - "tests/acoustic_windowpilot_live_probe.cjs"
      - "tests/acoustic_windowpilot_evidence.cjs"
      - "tests/physical_authorizer.cjs"
      - "tests/spatialruntime_window_authorizer.cjs"
      - "tests/spatialruntime_authorization_integrity.cjs"
      - "tests/live_acoustic_windowpilot_workflow.cjs"
      - ".github/workflows/physical-runtime-ci.yml"
      - ".github/workflows/live-acoustic-windowpilot-acceptance.yml"
  workflow_dispatch:

jobs:
  reconcile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout SpatialRuntime consumer dependency
        uses: actions/checkout@v4
        with:
          repository: hippoley/SpatialRuntime
          ref: d123ab9a5310cb9ce15d9e82630828a0d32211f4
          path: _spatialruntime
      - name: Verify pinned SpatialRuntime revision
        shell: bash
        run: test "$(git -C _spatialruntime rev-parse HEAD)" = "$SPATIALRUNTIME_COMMIT_SHA"
      - name: Install SpatialRuntime
        run: python -m pip install -e "_spatialruntime"
      - name: Check physical runtime JavaScript syntax
        run: |
          node --check scripts/commit_gate.cjs
          node --check scripts/physical_runtime.cjs
          node --check scripts/recovery_transaction.cjs
          node --check scripts/windowpilot_http_driver.cjs
          node --check scripts/runtime_context_adapter.cjs
          node --check scripts/contextual_edge_slu_adapter.cjs
          node --check scripts/stateful_checkpoint_trajectory.cjs
          node --check scripts/probe_windowpilot_checkpoint_e2e.cjs
          node --check scripts/run_acoustic_windowpilot_e2e.cjs
          node --check scripts/spatialruntime_authorizer.cjs
          python -m py_compile scripts/spatialruntime_window_authorizer.py
          node --check scripts/acoustic_windowpilot_evidence.cjs
          node --check scripts/verify_acoustic_windowpilot_evidence.cjs
          node --check scripts/run_stateful_checkpoint_v1.cjs
          node --check scripts/run_long_checkpoint_e2e_v2.cjs
      - name: Verify semantic commit gate
        run: node tests/commit_gate.cjs
      - name: Verify patch -> execute -> observe -> reconcile
        run: node tests/physical_runtime.cjs
      - name: Verify formal recovery transaction trust restore
        run: node tests/recovery_transaction.cjs
      - name: Verify device feedback enters next-turn context
        run: node tests/runtime_context_adapter.cjs
      - name: Verify Contextual Edge SLU repository boundary
        run: node tests/contextual_edge_slu_adapter.cjs
      - name: Verify WindowPilot HTTP write/readback contract
        run: node tests/windowpilot_http_driver.cjs
      - name: Verify live apply identity gate
        run: node tests/probe_windowpilot_checkpoint_e2e.cjs
      - name: Verify acoustic WindowPilot live probe safety
        run: node tests/acoustic_windowpilot_live_probe.cjs
      - name: Verify acoustic WindowPilot evidence receipt
        run: node tests/acoustic_windowpilot_evidence.cjs
      - name: Verify physical authorizer ordering and fail-closed behavior
        run: node tests/physical_authorizer.cjs
      - name: Verify SpatialRuntime authorization receipt integrity
        run: node tests/spatialruntime_authorization_integrity.cjs
      - name: Verify HomeAI consumes SpatialRuntime before WindowPilot dispatch
        run: node tests/spatialruntime_window_authorizer.cjs
      - name: Verify live acoustic hardware workflow stays manual and fail-closed
        run: node tests/live_acoustic_windowpilot_workflow.cjs
