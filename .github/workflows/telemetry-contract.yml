name: Telemetry trajectory contracts
on:
  push:
    paths:
      - 'scripts/*trajectory*.py'
      - 'scripts/telemetry_cli.py'
      - 'scripts/infer_flywire_delta.py'
      - 'tests/*telemetry*'
      - 'tests/test_phoenix_export.py'
      - 'tests/trajectory-browser.test.cjs'
      - 'requirements-telemetry.txt'
      - 'index.html'
      - 'review.html'
      - '.github/workflows/telemetry-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-telemetry.txt
      - name: Build immutable capability index for JS contracts
        run: python scripts/build_capability_index.py
      - run: |
          python -m unittest discover -s tests -p 'test_trajectory_telemetry.py'
          python -m unittest discover -s tests -p 'test_telemetry_http.py'
          python -m unittest discover -s tests -p 'test_phoenix_export.py'
          node --test tests/*.test.cjs
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('review.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', source)
          assert len(scripts) == 1
          Path('/tmp/flythink-review.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/flythink-review.js
