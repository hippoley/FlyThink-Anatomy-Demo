name: semantic-patch-training-v1
on:
  pull_request:
    paths:
      - scripts/semantic_patch_contract.py
      - scripts/train_semantic_patch_v1.py
      - scripts/semantic_context_features.py
      - scripts/generate_long_trajectory_benchmark_v3.py
      - scripts/benchmark_v3_training_adapter.py
      - scripts/whole_home_patch_corpus_v11.py
      - scripts/whole_home_patch_corpus_v12.py
      - tests/test_benchmark_v3_training_adapter.py
      - .github/workflows/semantic-patch-training-v1.yml
  push:
    paths:
      - scripts/semantic_patch_contract.py
      - scripts/train_semantic_patch_v1.py
      - scripts/semantic_context_features.py
      - scripts/flywire_topology_ablation.py
      - scripts/test_topology_ablation.py
      - scripts/contextual_state_transition_corpus_v1.py
      - scripts/test_contextual_state_transition_corpus_v1.py
      - scripts/transition_oracle.py
      - scripts/whole_home_patch_corpus_v10.py
      - scripts/generate_long_trajectory_benchmark_v3.py
      - scripts/benchmark_v3_training_adapter.py
      - scripts/whole_home_patch_corpus_v11.py
      - scripts/whole_home_patch_corpus_v12.py
      - tests/test_benchmark_v3_training_adapter.py
      - .github/workflows/semantic-patch-training-v1.yml
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile training sources
        run: python -m py_compile scripts/semantic_patch_contract.py scripts/generate_long_trajectory_benchmark_v3.py scripts/benchmark_v3_training_adapter.py scripts/whole_home_patch_corpus_v10.py scripts/whole_home_patch_corpus_v11.py scripts/whole_home_patch_corpus_v12.py scripts/semantic_context_features.py scripts/flywire_topology_ablation.py scripts/test_topology_ablation.py scripts/contextual_state_transition_corpus_v1.py scripts/test_contextual_state_transition_corpus_v1.py scripts/transition_oracle.py scripts/train_semantic_patch_v1.py
      - name: Install PyTorch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Validate transition corpus
        run: python scripts/test_contextual_state_transition_corpus_v1.py
      - name: Validate V3.2 training adapter
        run: python tests/test_benchmark_v3_training_adapter.py
      - name: Validate topology controls
        run: python scripts/test_topology_ablation.py
      - name: Train semantic FlyWire checkpoint
        run: python scripts/train_semantic_patch_v1.py --epochs 450
      - name: Show report
        run: cat artifacts/semantic-patch-v1/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-patch-v1
          path: artifacts/semantic-patch-v1/
