name: flywire-whole-home-training-v3
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/flywire_gated_patch_net.py"
      - "scripts/train_flywire_whole_home_patch_v3.py"
      - "scripts/whole_home_patch_corpus_v2.py"
      - ".github/workflows/flywire-whole-home-training-v3.yml"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Preflight
        run: python -m py_compile scripts/flywire_gated_patch_net.py scripts/train_flywire_whole_home_patch_v3.py scripts/whole_home_patch_corpus_v2.py
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Train FlyWire-gated real and disconnected models
        run: python scripts/train_flywire_whole_home_patch_v3.py --epochs 200 --out artifacts/flywire-whole-home-v3
      - run: cat artifacts/flywire-whole-home-v3/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-whole-home-training-v3
          path: artifacts/flywire-whole-home-v3/
