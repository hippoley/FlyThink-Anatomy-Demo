name: real-checkpoint-e2e-v1
on:
  push:
    paths: ["scripts/real_checkpoint_e2e_predictor.py","scripts/real_checkpoint_trajectory_v1.py","scripts/run_real_checkpoint_e2e_v1.py","scripts/run_stateful_checkpoint_v1.cjs","scripts/stateful_checkpoint_trajectory.cjs","scripts/checkpoint_jsonl_server.py","scripts/lexical_operation_evidence.py","tests/test_lexical_operation_evidence.py",".github/workflows/real-checkpoint-e2e-v1.yml"]
  workflow_dispatch:
    inputs:
      judgement_run_id:
        required: false
        default: '36372167785'
      semantic_run_id:
        required: false
        default: '36372786282'
jobs:
 e2e:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
   - uses: actions/download-artifact@v4
     with:
      name: context-judgement-v3
      path: artifacts/context-judgement-v3
      github-token: ${{ github.token }}
      run-id: ${{ inputs.judgement_run_id || '36372167785' }}
   - uses: actions/download-artifact@v4
     with:
      name: semantic-patch-v1
      path: artifacts/semantic-patch-v1
      github-token: ${{ github.token }}
      run-id: ${{ inputs.semantic_run_id || '36372786282' }}
   - run: python scripts/train_flywire.py --download --epochs 1 --out artifacts/flywire
   - run: python scripts/build_capability_index.py
   - run: python tests/test_lexical_operation_evidence.py
   - run: python -m py_compile scripts/checkpoint_inference.py scripts/context_slot_resolver.py scripts/checkpoint_jsonl_server.py scripts/real_checkpoint_e2e_predictor.py scripts/run_real_checkpoint_e2e_v1.py
   - run: python scripts/run_real_checkpoint_e2e_v1.py --graph artifacts/flywire/connectome.json --judgement artifacts/context-judgement-v3/model.pt --semantic artifacts/semantic-patch-v1/model.pt | tee /tmp/e2e.json
   - run: node scripts/run_stateful_checkpoint_v1.cjs --graph artifacts/flywire/connectome.json --judgement artifacts/context-judgement-v3/model.pt --semantic artifacts/semantic-patch-v1/model.pt | tee /tmp/stateful.json
