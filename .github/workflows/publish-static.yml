name: Publish Static Demo Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-demo-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Browser script syntax smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/flythink-app.js').write_text(js,encoding='utf-8')
          required=['Corpus Mutation Lab','Multi-turn Corpus Composer','Multi-turn Regression Lab','Persistent state tree','Grounding Decision Trace','resolutionGrid','capabilityCandidateForNode','capability_candidates','contract_derived_goal_plan_not_hidden_ground_truth','hybrid-state-goal-interrupt','goal_plan_contract','capability_schema_missing','stateTree','rawStateTree','intentTree','treePatchNode','runComposer','runBenchmark','diagnoseBenchmarkTurn','instance_grounding','state_tree_loss','duplicate_state_node','turnComposer','composerResults','benchCases','runAsSequence','semanticMatches','neuralBridge','projection_pool','neural','brain']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          PY
          node --check /tmp/flythink-app.js

      - name: Build real anatomy static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          python scripts/build_neural_artifacts.py
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          src=Path('data/real-home-thing-model-registry.json.gz.b64')
          dst=Path('_site/real-home-thing-model-registry.json')
          try:
              encoded=''.join(src.read_text().split())
              encoded += '=' * (-len(encoded) % 4)
              raw=base64.b64decode(encoded)
              data=gzip.decompress(raw)
              json.loads(data.decode('utf-8'))
              dst.write_bytes(data)
              print('real home thing-model registry bytes',len(data))
          except Exception as exc:
              print('warning: invalid optional Thing Model registry fixture:',repr(exc))
              dst.write_text(json.dumps({
                  'truth':'registry_fixture_unavailable',
                  'status':'degraded',
                  'reason':'invalid_public_registry_fixture',
                  'models':[]
              },ensure_ascii=False),encoding='utf-8')
          PY

          curl -L --fail --retry 4 --retry-all-errors \
            'https://storage.googleapis.com/flywire-data/codex/data/fafb/783/coordinates.csv.gz' \
            -o /tmp/coordinates.csv.gz

          python - <<'PY'
          import base64, csv, gzip, json, math
          from pathlib import Path

          encoded=''.join(Path('data/measured-snapshot.json.gz.b64').read_text().split())
          encoded += '=' * (-len(encoded) % 4)
          raw=base64.b64decode(encoded)
          snap=json.loads(gzip.decompress(raw).decode('utf-8'))
          Path('_site/measured-snapshot.json').write_text(
              json.dumps(snap,separators=(',',':')),encoding='utf-8')

          measured_roots={str(n['flywire_id']) for n in snap['graph']['nodes']}
          rows=[]
          measured={}
          with gzip.open('/tmp/coordinates.csv.gz','rt',newline='') as f:
              r=csv.DictReader(f)
              for row in r:
                  rid=str(row['root_id'])
                  vals=[float(v) for v in row['position'].strip().strip('[]').replace(',',' ').split()[:3]]
                  rows.append((rid,*vals))
                  if rid in measured_roots:
                      measured[rid]=vals

          cols=[[r[i] for r in rows] for i in (1,2,3)]
          def pct(a,p):
              a=sorted(a)
              x=(len(a)-1)*p
              lo=int(math.floor(x)); hi=int(math.ceil(x))
              if lo==hi:return a[lo]
              return a[lo]*(hi-x)+a[hi]*(x-lo)

          lo=[pct(c,.005) for c in cols]
          hi=[pct(c,.995) for c in cols]
          center=[(a+b)/2 for a,b in zip(lo,hi)]
          scale=max(b-a for a,b in zip(lo,hi))

          step=max(1,len(rows)//36000)
          sample_rows=rows[::step]
          sample=[[rid,(x-center[0])/scale,(y-center[1])/scale,(z-center[2])/scale]
                  for rid,x,y,z in sample_rows]

          # Keep developmental projection roots structurally separate from measured replay roots.
          # We derive a deterministic pool from the real coordinate table and explicitly exclude
          # every root that appears in the gold measured fixture.
          projection_candidates=[r for r in sample_rows if r[0] not in measured_roots]
          pool_target=512
          pool_step=max(1,len(projection_candidates)//pool_target)
          projection_rows=projection_candidates[::pool_step][:pool_target]
          projection_pool=[rid for rid,_,_,_ in projection_rows]

          by_root={rid:[rid,(xyz[0]-center[0])/scale,(xyz[1]-center[1])/scale,(xyz[2]-center[2])/scale]
                   for rid,xyz in measured.items()}
          for rid,x,y,z in projection_rows:
              by_root[rid]=[rid,(x-center[0])/scale,(y-center[1])/scale,(z-center[2])/scale]

          out={
              'truth':'measured_flywire_coordinate_derivative',
              'dataset':'FlyWire FAFB v783',
              'source':'https://storage.googleapis.com/flywire-data/codex/data/fafb/783/coordinates.csv.gz',
              'source_count':len(rows),
              'display_sampling_step':step,
              'normalization':{'center':center,'scale':scale,'percentile_bounds':'0.5-99.5'},
              'points':sample,
              'by_root':by_root,
              'projection_pool':projection_pool,
              'measured_root_ids':sorted(measured_roots),
          }
          Path('_site/anatomy-sample.json').write_text(
              json.dumps(out,separators=(',',':')),encoding='utf-8')

          assert len(rows)>100000
          assert len(measured)>=90
          assert len(projection_pool)>=216
          assert not (set(projection_pool) & measured_roots)
          print('source points',len(rows))
          print('display sample',len(sample))
          print('measured roots mapped',len(measured))
          print('developmental projection pool',len(projection_pool))
          PY

          touch _site/.nojekyll

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Publish FlyThink anatomy demo"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
