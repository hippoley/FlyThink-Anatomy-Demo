name: live-acoustic-windowpilot-acceptance

env:
  SPATIALRUNTIME_COMMIT_SHA: d123ab9a5310cb9ce15d9e82630828a0d32211f4

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type APPLY_REAL_HARDWARE to authorize the bounded physical probe"
        required: true
        type: string
      windowpilot_url:
        description: "WindowPilot base URL reachable from the self-hosted runner"
        required: true
        type: string
      area:
        description: "Room/area name bound to the real window (for example 主卧)"
        required: true
        type: string
      instance:
        description: "Thing Model instance"
        required: true
        default: "default"
        type: string
      expected_hardware_identity:
        description: "Expected WindowPilot hardware identity SHA-256"
        required: true
        type: string
      wav_path:
        description: "Absolute path to reviewed human-recorded mono PCM WAV on the self-hosted runner"
        required: true
        type: string
      fixture_manifest_path:
        description: "Absolute path to flythink.acoustic_fixture.v1 manifest for the WAV"
        required: true
        type: string
      scene_context_path:
        description: "Absolute path to reviewed HomeAI scene context built from an interior-kitchen verified handoff"
        required: true
        type: string
      contextual_state_path:
        description: "Absolute path to externally sealed contextual-state.v1 artifact on the self-hosted runner"
        required: true
        type: string
      authorization_ledger_path:
        description: "Absolute persistent path to the single-use authorization ledger on the self-hosted runner"
        required: true
        type: string
      probe_open_pct:
        description: "Bounded live opening probe percentage"
        required: true
        default: "5"
        type: string
      tolerance_pct:
        description: "Measured readback tolerance percentage"
        required: true
        default: "1"
        type: string
      timeout_ms:
        description: "WindowPilot command/readback timeout"
        required: true
        default: "5000"
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: physical-lab-windowpilot
  cancel-in-progress: false

jobs:
  live-acceptance:
    runs-on: [self-hosted, linux]
    environment: physical-lab
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Checkout SpatialRuntime consumer dependency
        uses: actions/checkout@v4
        with:
          repository: hippoley/SpatialRuntime
          ref: d123ab9a5310cb9ce15d9e82630828a0d32211f4
          path: _spatialruntime
      - name: Verify pinned SpatialRuntime revision
        shell: bash
        run: test "$(git -C _spatialruntime rev-parse HEAD)" = "$SPATIALRUNTIME_COMMIT_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate operator inputs before touching hardware
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_apply }}" = "APPLY_REAL_HARDWARE"
          test -f "${{ inputs.wav_path }}"
          test -f "${{ inputs.fixture_manifest_path }}"
          test -f "${{ inputs.scene_context_path }}"
          test -f "${{ inputs.contextual_state_path }}"
          python - <<'PY'
          import os, re
          from pathlib import Path
          hw=os.environ["INPUT_HW"]
          assert re.fullmatch(r"[0-9a-fA-F]{64}",hw),               "expected_hardware_identity must be exactly 64 hex characters"
          probe=float(os.environ["INPUT_PROBE"])
          tolerance=float(os.environ["INPUT_TOLERANCE"])
          assert 0 < probe <= 5, "probe_open_pct must be in (0,5]"
          assert 0 <= tolerance <= 2, "tolerance_pct must be in [0,2]"
          assert probe > tolerance, "probe_open_pct must exceed tolerance_pct"
          context_path=Path(os.environ["INPUT_CONTEXTUAL_STATE"])
          ledger_path=Path(os.environ["INPUT_AUTH_LEDGER"])
          assert context_path.is_absolute(), "contextual_state_path must be absolute"
          assert ledger_path.is_absolute(), "authorization_ledger_path must be absolute"
          assert context_path.is_file(), "contextual_state_path must exist"
          assert ledger_path.parent.exists(), "authorization ledger parent must exist"
          assert os.access(ledger_path.parent, os.W_OK), "authorization ledger parent must be writable"
          PY
          python - <<'PY'
          import json, os, pathlib, wave
          wav=pathlib.Path(os.environ["INPUT_WAV"])
          manifest_path=pathlib.Path(os.environ["INPUT_MANIFEST"])
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest.get("schema")=="flythink.acoustic_fixture.v1"
          assert manifest.get("source_kind")=="human_recording"
          assert manifest.get("expected_text"), "expected_text missing"
          max_cer=(manifest.get("acceptance") or {}).get("max_cer")
          assert isinstance(max_cer,(int,float)) and 0 <= max_cer <= 1
          with wave.open(str(wav),"rb") as wf:
              assert wf.getnchannels()==1, "WAV must be mono"
              assert wf.getsampwidth()==2, "WAV must be 16-bit PCM"
              assert wf.getnframes()>0, "WAV has no frames"
          print({
              "source_kind":manifest["source_kind"],
              "expected_text":manifest["expected_text"],
              "max_cer":max_cer,
              "wav_bytes":wav.stat().st_size,
          })
          PY
          node - <<'NODE'
          const {loadPinnedSceneContext,targetKey}=require("./scripts/spatialruntime_world_context.cjs");
          const context=loadPinnedSceneContext(process.env.INPUT_SCENE_CONTEXT);
          if(!context.handoff_evidence){
            throw new Error("live scene context must contain verified handoff evidence");
          }
          if(context.handoff_evidence.source_repo!=="hippoley/interior-kitchen-original"){
            throw new Error("live scene handoff source repo mismatch");
          }
          if(!/^[0-9a-f]{40}$/.test(String(context.handoff_evidence.source_commit_sha||""))){
            throw new Error("live scene handoff source commit missing");
          }
          if(context.spatialruntime_commit_sha!==process.env.SPATIALRUNTIME_COMMIT_SHA){
            throw new Error("live scene SpatialRuntime commit mismatch");
          }
          if(
            context.handoff_evidence.spatialruntime_commit_sha &&
            context.handoff_evidence.spatialruntime_commit_sha!==process.env.SPATIALRUNTIME_COMMIT_SHA
          ){
            throw new Error("live scene handoff SpatialRuntime commit mismatch");
          }
          const target={
            area:process.env.INPUT_AREA,
            entity:"窗",
            instance:process.env.INPUT_INSTANCE||"default"
          };
          if(!context.exterior_window_keys.includes(targetKey(target))){
            throw new Error("live physical target is not a reviewed exterior window in scene context");
          }
          console.log({
            context_sha256:context.context_sha256,
            source_commit_sha:context.handoff_evidence.source_commit_sha,
            spatialruntime_commit_sha:context.spatialruntime_commit_sha,
            target:targetKey(target)
          });
          NODE
        env:
          INPUT_WAV: ${{ inputs.wav_path }}
          INPUT_MANIFEST: ${{ inputs.fixture_manifest_path }}
          INPUT_SCENE_CONTEXT: ${{ inputs.scene_context_path }}
          INPUT_CONTEXTUAL_STATE: ${{ inputs.contextual_state_path }}
          INPUT_AUTH_LEDGER: ${{ inputs.authorization_ledger_path }}
          INPUT_AREA: ${{ inputs.area }}
          INPUT_INSTANCE: ${{ inputs.instance }}
          INPUT_HW: ${{ inputs.expected_hardware_identity }}
          INPUT_PROBE: ${{ inputs.probe_open_pct }}
          INPUT_TOLERANCE: ${{ inputs.tolerance_pct }}

      - name: Install acoustic + checkpoint runtimes + SpatialRuntime
        run: |
          pip install -r requirements-asr.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e "_spatialruntime"

      - name: Download official Chinese streaming ASR model
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2
          tar xjf sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2

      - name: Download frozen judgement checkpoint
        uses: actions/download-artifact@v4
        with:
          name: context-judgement-v3
          path: artifacts/context-judgement-v3
          github-token: ${{ github.token }}
          run-id: "36372167785"

      - name: Download frozen semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: semantic-patch-v1
          path: artifacts/semantic-patch-v1
          github-token: ${{ github.token }}
          run-id: "36372786282"

      - name: Build FlyWire + immutable Thing Model runtime context
        run: |
          python scripts/train_flywire.py --download --epochs 1 --out artifacts/flywire
          python scripts/build_capability_index.py

      - name: DRY_RUN human WAV -> sherpa -> checkpoint -> WindowPilot readiness
        shell: bash
        run: |
          set -euo pipefail
          MODEL=sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23
          python scripts/live_acoustic_windowpilot.py             --wav "${{ inputs.wav_path }}"             --fixture-manifest "${{ inputs.fixture_manifest_path }}"             --require-human-fixture             --spatialruntime-authorize             --scene-context "${{ inputs.scene_context_path }}"             --url "${{ inputs.windowpilot_url }}"             --area "${{ inputs.area }}"             --entity "窗"             --instance "${{ inputs.instance }}"             --expected-hardware-identity "${{ inputs.expected_hardware_identity }}"             --probe-open-pct "${{ inputs.probe_open_pct }}"             --tolerance "${{ inputs.tolerance_pct }}"             --timeout-ms "${{ inputs.timeout_ms }}"             --graph artifacts/flywire/connectome.json             --judgement artifacts/context-judgement-v3/model.pt             --semantic artifacts/semantic-patch-v1/model.pt             --tokens "$MODEL/tokens.txt"             --encoder "$MODEL/encoder-epoch-99-avg-1.int8.onnx"             --decoder "$MODEL/decoder-epoch-99-avg-1.onnx"             --joiner "$MODEL/joiner-epoch-99-avg-1.int8.onnx"             > live-acoustic-dry-run.json

          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("live-acoustic-dry-run.json","utf8"));
          const finals=(x.trace||[]).filter(t=>t.asr&&t.asr.is_final);
          if(x.mode!=="DRY_RUN")throw new Error("dry-run mode mismatch");
          if(x.speculative_physical_commands!==0)throw new Error("speculative hypothesis reached driver");
          if(x.physical_driver_commands!==0)throw new Error("dry-run touched physical driver");
          if(x.final_segments!==1)throw new Error("expected exactly one final ASR segment");
          if(finals.length!==1)throw new Error("expected exactly one final semantic trace");
          const targets=(finals[0].target_resolution&&finals[0].target_resolution.targets)||[];
          if(!targets.some(t=>t.area===process.env.EXPECTED_AREA&&(t.entity==="窗"||t.entity==="窗户"))){
            throw new Error("dry-run semantic target does not match requested physical window");
          }
          console.log({
            final_text:finals[0].asr.text,
            decision:finals[0].semantic.decision,
            targets,
            physical_driver_commands:x.physical_driver_commands,
            readiness:x.readiness
          });
          NODE
        env:
          EXPECTED_AREA: ${{ inputs.area }}

      - name: APPLY human WAV -> sherpa -> checkpoint -> WindowPilot -> measured readback -> reconcile
        shell: bash
        run: |
          set -euo pipefail
          MODEL=sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23
          python scripts/live_acoustic_windowpilot.py             --wav "${{ inputs.wav_path }}"             --fixture-manifest "${{ inputs.fixture_manifest_path }}"             --require-human-fixture             --spatialruntime-authorize             --scene-context "${{ inputs.scene_context_path }}"             --apply             --receipt live-execution-receipt.json             --proof-bundle live-execution-proof-bundle.json             --contextual-state "${{ inputs.contextual_state_path }}"             --authorization-ledger "${{ inputs.authorization_ledger_path }}"             --url "${{ inputs.windowpilot_url }}"             --area "${{ inputs.area }}"             --entity "窗"             --instance "${{ inputs.instance }}"             --expected-hardware-identity "${{ inputs.expected_hardware_identity }}"             --probe-open-pct "${{ inputs.probe_open_pct }}"             --tolerance "${{ inputs.tolerance_pct }}"             --timeout-ms "${{ inputs.timeout_ms }}"             --graph artifacts/flywire/connectome.json             --judgement artifacts/context-judgement-v3/model.pt             --semantic artifacts/semantic-patch-v1/model.pt             --tokens "$MODEL/tokens.txt"             --encoder "$MODEL/encoder-epoch-99-avg-1.int8.onnx"             --decoder "$MODEL/decoder-epoch-99-avg-1.onnx"             --joiner "$MODEL/joiner-epoch-99-avg-1.int8.onnx"             > live-acoustic-windowpilot-result.json

      - name: Independently verify canonical execution proof
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_execution_proof_bundle_cli.cjs live-execution-proof-bundle.json > live-execution-proof-verification.json
          cat live-execution-proof-verification.json
          node - <<'NODE'
          const fs=require("fs");
          const {verifyExecutionReceipt}=require("./scripts/execution_receipt.cjs");
          const bundleVerdict=JSON.parse(fs.readFileSync("live-execution-proof-verification.json","utf8"));
          if(bundleVerdict.verdict!=="VERIFIED"||bundleVerdict.valid!==true){
            throw new Error("canonical proof bundle invalid");
          }
          if(bundleVerdict.physical_truth_verified!==true){
            throw new Error("canonical proof did not verify physical truth");
          }
          const receipt=JSON.parse(fs.readFileSync("live-execution-receipt.json","utf8"));
          const verified=verifyExecutionReceipt(receipt);
          if(verified.physical_completion_verified!==true){
            throw new Error("physical completion criterion/witness verification failed");
          }
          console.log({
            receipt_sha256:verified.receipt_sha256,
            physical_truth_verified:verified.physical_truth_verified,
            physical_completion_verified:verified.physical_completion_verified,
            bundle_sha256:bundleVerdict.bundle_sha256
          });
          NODE

      - name: Attest validated live evidence provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            live-acoustic-dry-run.json
            live-acoustic-windowpilot-result.json
            live-execution-receipt.json
            live-execution-proof-bundle.json
            live-execution-proof-verification.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-canonical-windowpilot-golden-proof-candidate
          if-no-files-found: error
          path: |
            live-acoustic-dry-run.json
            live-acoustic-windowpilot-result.json
            live-execution-receipt.json
            live-execution-proof-bundle.json
            live-execution-proof-verification.json
          retention-days: 90
