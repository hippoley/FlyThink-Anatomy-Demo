name: flywire-whole-home-training-v4
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/whole_home_patch_corpus_v4.py"
      - "scripts/train_flywire_whole_home_patch_v4.py"
      - "scripts/flywire_gated_patch_net.py"
      - ".github/workflows/flywire-whole-home-training-v4.yml"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Preflight
        run: |
          python -m py_compile scripts/whole_home_patch_corpus_v4.py scripts/train_flywire_whole_home_patch_v4.py
          python scripts/whole_home_patch_corpus_v4.py
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Train v4 real and disconnected
        run: python scripts/train_flywire_whole_home_patch_v4.py --epochs 240
      - run: cat artifacts/flywire-whole-home-v4/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: flywire-whole-home-training-v4
          path: artifacts/flywire-whole-home-v4/
