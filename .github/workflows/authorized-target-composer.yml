name: authorized-target-composer
on:
  push:
    paths:
      - scripts/authorized_target_composer.py
      - scripts/test_authorized_target_composer.py
      - .github/workflows/authorized-target-composer.yml
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/authorized_target_composer.py scripts/test_authorized_target_composer.py
      - run: python scripts/test_authorized_target_composer.py
