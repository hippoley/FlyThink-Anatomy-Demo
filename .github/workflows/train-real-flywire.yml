name: Train real FlyWire subgraph
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-flywire.txt
      - run: python scripts/train_flywire.py --download --neurons 512 --epochs 30
      - name: Restore and verify inference
        run: python scripts/infer_flywire.py '改成主卧的窗户' --history '打开客厅窗户'
      - name: Sequential state training and matched controls
        run: python scripts/train_flywire_state.py --epochs 40
      - name: State commit and causal gradient tests
        run: python -m unittest discover -s tests -p 'test_flywire_state.py'
      - name: Verify sequential checkpoint restore
        run: python scripts/infer_flywire_state.py '打开客厅灯' '主卧窗户打开' '好的我知道了' '全部撤回'
      - name: Train direct node-slot-value deltas and controls
        run: python scripts/train_flywire_delta.py --epochs 30 --out artifacts/flywire-delta-v14
      - name: Verify direct Delta gates and restored inference
        run: |
          python -m unittest discover -s tests -p 'test_flywire_delta.py'
          python scripts/infer_flywire_delta.py '打开客厅灯' '主卧窗户调到70%' '刚才那个改成30%' '帮我写首诗' '全部撤回'
      - uses: actions/upload-artifact@v4
        with:
          name: real-flywire-subgraph-checkpoint-and-evidence
          path: |
            artifacts/flywire/
            artifacts/flywire-state/
            artifacts/flywire-delta-v14/
