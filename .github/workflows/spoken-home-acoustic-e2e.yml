name: spoken-home-acoustic-e2e

on:
  pull_request:
    paths:
      - "requirements-asr.txt"
      - "data/spoken-home-command-corpus-v1.json"
      - "data/home-asr-hotwords.txt"
      - "data/home-asr-hotwords.txt"
      - "scripts/generate_spoken_home_fixture.py"
      - "scripts/sherpa_streaming_asr.py"
      - "scripts/asr_event_protocol.py"
      - "scripts/asr_event_bridge.cjs"
      - "scripts/run_acoustic_slu_e2e.cjs"
      - "scripts/validate_spoken_home_acoustic.cjs"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/checkpoint_runtime.py"
      - ".github/workflows/spoken-home-acoustic-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "requirements-asr.txt"
      - "data/spoken-home-command-corpus-v1.json"
      - "scripts/generate_spoken_home_fixture.py"
      - "scripts/sherpa_streaming_asr.py"
      - "scripts/asr_event_protocol.py"
      - "scripts/asr_event_bridge.cjs"
      - "scripts/run_acoustic_slu_e2e.cjs"
      - "scripts/validate_spoken_home_acoustic.cjs"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/checkpoint_runtime.py"
      - ".github/workflows/spoken-home-acoustic-e2e.yml"
  workflow_dispatch:

jobs:
  spoken-home:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install acoustic runtime
        run: pip install -r requirements-asr.txt

      - name: Download Chinese TTS and streaming ASR models
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-icefall-zh-aishell3.tar.bz2
          tar xjf vits-icefall-zh-aishell3.tar.bz2
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-xlarge-int8-2025-06-30.tar.bz2
          tar xjf sherpa-onnx-streaming-zipformer-zh-xlarge-int8-2025-06-30.tar.bz2

      - name: Install semantic checkpoint runtime
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download judgement checkpoint
        uses: actions/download-artifact@v4
        with:
          name: context-judgement-v3
          path: artifacts/context-judgement-v3
          github-token: ${{ github.token }}
          run-id: "36372167785"

      - name: Download semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: semantic-patch-v1
          path: artifacts/semantic-patch-v1
          github-token: ${{ github.token }}
          run-id: "36372786282"

      - name: Build whole-home runtime context
        run: |
          python scripts/train_flywire.py --download --epochs 1 --out artifacts/flywire
          python scripts/build_capability_index.py
          python scripts/generate_long_trajectory_benchmark_v2.py --count 1 --out benchmarks/spoken-runtime.json
          mkdir -p artifacts/spoken-home

      - name: Generate, recognize, execute, and verify three voices
        run: |
          set -uo pipefail
          TTS=vits-icefall-zh-aishell3
          ASR=sherpa-onnx-streaming-zipformer-zh-xlarge-int8-2025-06-30
          TEXT="打开主卧空调"
          FAIL=0
          : > artifacts/spoken-home/diagnostics.jsonl

          for SID in 10 33 99; do
            WAV="artifacts/spoken-home/open-main-bedroom-ac-sid-${SID}.wav"
            EVENTS="artifacts/spoken-home/open-main-bedroom-ac-sid-${SID}.events.jsonl"
            RESULT="artifacts/spoken-home/open-main-bedroom-ac-sid-${SID}.result.json"
            VALIDATION="artifacts/spoken-home/open-main-bedroom-ac-sid-${SID}.validation.txt"

            python scripts/generate_spoken_home_fixture.py \
              --model "$TTS/model.onnx" \
              --lexicon "$TTS/lexicon.txt" \
              --tokens "$TTS/tokens.txt" \
              --rule-fsts "$TTS/phone.fst,$TTS/date.fst,$TTS/number.fst" \
              --sid "$SID" \
              --output "$WAV" \
              "$TEXT" || { echo "TTS failed for SID=$SID"; FAIL=1; continue; }

            python scripts/sherpa_streaming_asr.py \
              --wav "$WAV" \
              --tokens "$ASR/tokens.txt" \
              --encoder "$ASR/encoder.int8.onnx" \
              --decoder "$ASR/decoder.onnx" \
              --joiner "$ASR/joiner.int8.onnx" \
              --decoding-method modified_beam_search \
              --hotwords-file data/home-asr-hotwords.txt \
              --hotwords-score 2.0 \
              --modeling-unit cjkchar \
              > "$EVENTS" || { echo "ASR failed for SID=$SID"; FAIL=1; continue; }

            cat "$EVENTS"
            python - "$SID" "$EVENTS" >> artifacts/spoken-home/diagnostics.jsonl <<'PY'
          import json,sys
          sid=int(sys.argv[1])
          rows=[json.loads(x) for x in open(sys.argv[2],encoding="utf-8") if x.strip()]
          print(json.dumps({
              "sid":sid,
              "partials":[x["text"] for x in rows if x["kind"]=="partial"],
              "stable":[x["text"] for x in rows if x["kind"]=="stable"],
              "final":[x["text"] for x in rows if x["kind"]=="final"],
          },ensure_ascii=False))
          PY

            if ! cat "$EVENTS" | node scripts/run_acoustic_slu_e2e.cjs \
              --benchmark benchmarks/spoken-runtime.json \
              --graph artifacts/flywire/connectome.json \
              --judgement artifacts/context-judgement-v3/model.pt \
              --semantic artifacts/semantic-patch-v1/model.pt \
              > "$RESULT"; then
              echo "SLU runtime failed for SID=$SID" | tee "$VALIDATION"
              FAIL=1
              continue
            fi

            if ! node scripts/validate_spoken_home_acoustic.cjs \
              --manifest data/spoken-home-command-corpus-v1.json \
              --case open-main-bedroom-ac \
              --events "$EVENTS" \
              --result "$RESULT" | tee "$VALIDATION"; then
              echo "VALIDATION FAILED SID=$SID" | tee -a "$VALIDATION"
              FAIL=1
            fi
          done

          echo "=== all speaker diagnostics ==="
          cat artifacts/spoken-home/diagnostics.jsonl
          exit "$FAIL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spoken-home-acoustic-e2e
          path: artifacts/spoken-home/
