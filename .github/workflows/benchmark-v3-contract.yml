name: benchmark-v3-contract

on:
  pull_request:
    paths:
      - "scripts/generate_long_trajectory_benchmark_v3.py"
      - "scripts/validate_long_trajectory_benchmark_v3.py"
      - "scripts/run_long_checkpoint_e2e_v3.cjs"
      - "scripts/check_benchmark_v3_contract.py"
      - "scripts/validate_benchmark_v3_oracle_runner.cjs"
      - "tests/benchmark_v3_metrics.cjs"
      - "tests/benchmark_v3_baselines.cjs"
      - "scripts/run_benchmark_v3_baselines.cjs"
      - "scripts/validate_benchmark_v3_baselines.py"
      - "tests/benchmark_v3_teacher_forced.cjs"
      - "scripts/run_benchmark_v3_teacher_forced.cjs"
      - "scripts/build_benchmark_v3_first_failure_ledger.py"
      - "docs/benchmark-v3.md"
      - ".github/workflows/benchmark-v3-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/generate_long_trajectory_benchmark_v3.py"
      - "scripts/validate_long_trajectory_benchmark_v3.py"
      - "scripts/run_long_checkpoint_e2e_v3.cjs"
      - "scripts/check_benchmark_v3_contract.py"
      - "tests/benchmark_v3_metrics.cjs"
      - "docs/benchmark-v3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax
        run: |
          python -m py_compile scripts/generate_long_trajectory_benchmark_v3.py scripts/validate_long_trajectory_benchmark_v3.py
          node --check scripts/run_long_checkpoint_e2e_v3.cjs
          node --check tests/benchmark_v3_metrics.cjs
          node --check tests/benchmark_v3_baselines.cjs
          node --check scripts/run_benchmark_v3_baselines.cjs
          python -m py_compile scripts/validate_benchmark_v3_baselines.py
          node --check tests/benchmark_v3_teacher_forced.cjs
          node --check scripts/run_benchmark_v3_teacher_forced.cjs
          python -m py_compile scripts/build_benchmark_v3_first_failure_ledger.py
          node --check scripts/validate_benchmark_v3_oracle_runner.cjs
      - name: Generate frozen-shape V3 corpus
        run: python scripts/generate_long_trajectory_benchmark_v3.py --count 180 --out /tmp/long_trajectories_v3.json
      - name: Validate split isolation, oracle integrity and coverage
        run: python scripts/validate_long_trajectory_benchmark_v3.py /tmp/long_trajectories_v3.json
      - name: Prove corrected semantic profile without rewriting legacy release
        run: |
          python scripts/generate_long_trajectory_benchmark_v3.py --count 180 --release-id 2026-10-r2 --out /tmp/long_trajectories_v3_r2.json
          python scripts/validate_long_trajectory_benchmark_v3.py /tmp/long_trajectories_v3_r2.json
          node scripts/validate_benchmark_v3_oracle_runner.cjs /tmp/long_trajectories_v3_r2.json
      - name: Prove gold oracle is executable by canonical stateful runner
        run: node scripts/validate_benchmark_v3_oracle_runner.cjs /tmp/long_trajectories_v3.json
      - name: Validate stratified evaluator metrics
        run: node tests/benchmark_v3_metrics.cjs
      - name: Validate teacher-forced causal evaluator
        run: node tests/benchmark_v3_teacher_forced.cjs
      - name: Validate deterministic baseline discrimination
        run: |
          node tests/benchmark_v3_baselines.cjs
          node scripts/run_benchmark_v3_baselines.cjs --benchmark /tmp/long_trajectories_v3.json --split sealed > /tmp/benchmark-v3-baselines.json
          cat /tmp/benchmark-v3-baselines.json
          python scripts/validate_benchmark_v3_baselines.py /tmp/benchmark-v3-baselines.json
      - name: Reproducibility
        run: |
          python scripts/generate_long_trajectory_benchmark_v3.py --count 180 --out /tmp/long_trajectories_v3_again.json
          cmp /tmp/long_trajectories_v3.json /tmp/long_trajectories_v3_again.json


  real-upstream-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install real checkpoint runtime
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Download real judgement checkpoint
        uses: actions/download-artifact@v4
        with:
          name: context-judgement-v3
          path: artifacts/context-judgement-v3
          github-token: ${{ github.token }}
          run-id: "36372167785"
      - name: Download real semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: semantic-patch-v1
          path: artifacts/semantic-patch-v1
          github-token: ${{ github.token }}
          run-id: "36372786282"
      - name: Build actual graph/index dependencies
        run: |
          python scripts/train_flywire.py --download --epochs 1 --out artifacts/flywire
          python scripts/build_capability_index.py
      - name: Generate and validate current V3 release
        run: |
          python scripts/generate_long_trajectory_benchmark_v3.py --count 180 --release-id "2026-10" --out benchmark-v3.json
          python scripts/validate_long_trajectory_benchmark_v3.py benchmark-v3.json | tee benchmark-v3-validation.json
      - name: Execute sealed split through real upstream checkpoints
        id: evaluate
        shell: bash
        run: |
          set +e
          node scripts/run_long_checkpoint_e2e_v3.cjs             --benchmark benchmark-v3.json             --split sealed             --repeats 1             --graph artifacts/flywire/connectome.json             --judgement artifacts/context-judgement-v3/model.pt             --semantic artifacts/semantic-patch-v1/model.pt             > benchmark-v3-real-upstream.json
          code=$?
          echo "evaluator_exit_code=$code" >> "$GITHUB_OUTPUT"
          cat benchmark-v3-real-upstream.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Build auditable evidence manifest
        run: |
          python scripts/build_benchmark_v3_upstream_evidence.py             --benchmark benchmark-v3.json             --result benchmark-v3-real-upstream.json             --graph artifacts/flywire/connectome.json             --judgement artifacts/context-judgement-v3/model.pt             --semantic artifacts/semantic-patch-v1/model.pt             --judgement-run-id "36372167785"             --semantic-run-id "36372786282"             --out benchmark-v3-real-upstream-evidence.json
          cat benchmark-v3-real-upstream-evidence.json
      - name: Public-review summary
        run: |
          python - <<'PY'
          import json
          e=json.load(open("benchmark-v3-real-upstream-evidence.json"))
          r=json.load(open("benchmark-v3-real-upstream.json"))
          print("REAL_UPSTREAM_EVIDENCE", json.dumps({
            "release_id":e["source"]["benchmark_release_id"],
            "benchmark_sha256":e["source"]["benchmark_manifest_sha256"],
            "judgement_run_id":e["source"]["judgement_artifact_run_id"],
            "semantic_run_id":e["source"]["semantic_artifact_run_id"],
            "overall":r["overall"],
            "strict_trajectory_rate":r["strict_trajectory_rate"],
            "pass_pow_k":r["pass_pow_k"],
            "unsafe_execute":r["unsafe_execute"],
            "wrong_device":r["wrong_device"],
            "untouched_state_violation":r["untouched_state_violation"],
            "verdict":e["verdict"]
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-v3-real-upstream-evidence-pr
          retention-days: 90
          path: |
            benchmark-v3.json
            benchmark-v3-validation.json
            benchmark-v3-real-upstream.json
            benchmark-v3-real-upstream-evidence.json
      - name: Evidence production gate
        run: |
          python - <<'PY'
          import json
          e=json.load(open("benchmark-v3-real-upstream-evidence.json"))
          assert e["claim_scope"]["real_upstream_checkpoint_execution"] is True
          assert e["claim_scope"]["real_hardware_execution"] is False
          assert e["verdict"]["evidence_complete"] is True
          print("benchmark-v3-real-upstream-evidence: COMPLETE")
          PY
