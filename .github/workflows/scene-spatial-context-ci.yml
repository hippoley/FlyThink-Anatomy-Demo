name: scene-spatial-context-ci

env:
  SPATIALRUNTIME_COMMIT_SHA: d123ab9a5310cb9ce15d9e82630828a0d32211f4

on:
  pull_request:
    paths:
      - "scripts/spatialruntime_world_context.cjs"
      - "scripts/build_spatialruntime_scene_context.cjs"
      - "scripts/spatialruntime_authorizer.cjs"
      - "scripts/spatialruntime_window_authorizer.py"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/run_acoustic_windowpilot_e2e.cjs"
      - "scripts/live_acoustic_windowpilot.py"
      - "tests/spatialruntime_world_context.cjs"
      - "tests/spatialruntime_scene_authorizer.cjs"
      - "tests/spatialruntime_scene_handoff.cjs"
      - "tests/live_scene_handoff_workflow.cjs"
      - "tests/spatialruntime_scene_context_provenance.cjs"
      - "tests/fixtures/interior-kitchen.scene-context.json"
      - "tests/fixtures/interior-kitchen.scene-context.provenance.json"
      - ".github/workflows/scene-spatial-context-ci.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [interior-spatialruntime-handoff-updated]
  schedule:
    - cron: "17 3 * * *"

jobs:
  scene-to-homeai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout SpatialRuntime
        uses: actions/checkout@v4
        with:
          repository: hippoley/SpatialRuntime
          ref: d123ab9a5310cb9ce15d9e82630828a0d32211f4
          path: _spatialruntime
      - name: Verify pinned SpatialRuntime revision
        shell: bash
        run: test "$(git -C _spatialruntime rev-parse HEAD)" = "$SPATIALRUNTIME_COMMIT_SHA"

      - name: Install SpatialRuntime
        run: python -m pip install -e "_spatialruntime"

      - name: Check scene consumer syntax
        run: |
          node --check scripts/spatialruntime_world_context.cjs
          node --check scripts/build_spatialruntime_scene_context.cjs
          node --check scripts/spatialruntime_authorizer.cjs
          python -m py_compile scripts/spatialruntime_window_authorizer.py

      - name: Verify pinned private-scene provenance
        run: |
          node tests/spatialruntime_scene_context_provenance.cjs \
            tests/fixtures/interior-kitchen.scene-context.json \
            tests/fixtures/interior-kitchen.scene-context.provenance.json

      - name: Verify pinned authored scene facts drive SpatialRuntime rain safety
        run: |
          node tests/spatialruntime_scene_authorizer.cjs \
            tests/fixtures/interior-kitchen.scene-context.json

      - name: Verify downstream handoff drives SpatialRuntime authorization
        run: node tests/spatialruntime_scene_handoff.cjs

      - name: Verify live cross-repo workflow binds upstream handoff
        run: node tests/live_scene_handoff_workflow.cjs

  live-interior-scene-to-homeai:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || vars.ENABLE_CROSS_REPO_LIVE == 'true' }}
    runs-on: ubuntu-latest
    env:
      CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
    steps:
      - name: Report cross-repo access mode
        shell: bash
        run: |
          if [ -n "$CROSS_REPO_READ_TOKEN" ]; then
            echo "LIVE_SCENE_CONSUMER_ACCESS=token"
          else
            echo "LIVE_SCENE_CONSUMER_ACCESS=public-repository"
          fi

      - name: Checkout HomeAI consumer
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout SpatialRuntime
        uses: actions/checkout@v4
        with:
          repository: hippoley/SpatialRuntime
          ref: d123ab9a5310cb9ce15d9e82630828a0d32211f4
          path: _spatialruntime

      - name: Verify pinned SpatialRuntime revision in live consumer
        shell: bash
        run: test "$(git -C _spatialruntime rev-parse HEAD)" = "$SPATIALRUNTIME_COMMIT_SHA"

      - name: Install SpatialRuntime
        run: python -m pip install -e "_spatialruntime"

      - name: Checkout dispatched or latest authored interior scene
        uses: actions/checkout@v4
        with:
          repository: hippoley/interior-kitchen-original
          ref: ${{ github.event.client_payload.source_commit_sha || 'main' }}
          path: _interior
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Install authored scene dependencies
        working-directory: _interior
        run: npm ci

      - name: Export and validate latest authored WorldSnapshot
        working-directory: _interior
        run: |
          node scripts/export-spatialruntime-world.mjs /tmp/interior-world.json
          python scripts/validate-spatialruntime-world.py \
            /tmp/interior-world.json \
            /tmp/interior-validation.json

      - name: Build and validate latest authored scene handoff
        working-directory: _interior
        run: |
          python scripts/build-spatialruntime-handoff.py \
            /tmp/interior-world.json \
            /tmp/interior-validation.json \
            /tmp/interior-handoff.json
          python scripts/validate-spatialruntime-handoff.py \
            /tmp/interior-world.json \
            /tmp/interior-validation.json \
            /tmp/interior-handoff.json

      - name: Build HomeAI scene context from verified upstream handoff
        shell: bash
        run: |
          UPSTREAM_SHA="$(git -C _interior rev-parse HEAD)"
          node scripts/build_spatialruntime_scene_context.cjs \
            /tmp/interior-world.json \
            /tmp/interior-validation.json \
            --handoff /tmp/interior-handoff.json \
            --expected-source-repo hippoley/interior-kitchen-original \
            --expected-source-commit "$UPSTREAM_SHA" \
            --out /tmp/interior-homeai-context.json

      - name: Verify live upstream WorldSnapshot contract
        run: |
          node tests/spatialruntime_world_context.cjs \
            /tmp/interior-world.json \
            /tmp/interior-validation.json

      - name: Verify live authored scene drives HomeAI SpatialRuntime safety
        run: |
          node tests/spatialruntime_scene_authorizer.cjs \
            /tmp/interior-homeai-context.json

      - name: Record live upstream revision
        shell: bash
        run: |
          git -C _interior rev-parse HEAD | tee /tmp/interior-upstream-sha.txt
          python - <<'PY'
          import json
          world=json.load(open('/tmp/interior-world.json',encoding='utf-8'))
          receipt=json.load(open('/tmp/interior-validation.json',encoding='utf-8'))
          context=json.load(open('/tmp/interior-homeai-context.json',encoding='utf-8'))
          handoff=json.load(open('/tmp/interior-handoff.json',encoding='utf-8'))
          upstream_sha=open('/tmp/interior-upstream-sha.txt',encoding='utf-8').read().strip()
          dispatch_sha='${{ github.event.client_payload.source_commit_sha || '' }}'.strip()
          if dispatch_sha:
              assert upstream_sha==dispatch_sha
          assert receipt['source_fingerprint_verified'] is True
          assert context['source_fingerprint']==receipt['source_fingerprint']
          assert context['world_snapshot_sha256']==receipt['world_snapshot_sha256']
          assert context['world_snapshot_revision']==world['revision']
          assert world['facts']['source_fingerprint']==receipt['source_fingerprint']
          assert handoff['source_commit_sha']==upstream_sha
          assert context['handoff_evidence']['source_commit_sha']==upstream_sha
          assert context['handoff_evidence']['handoff_sha256']==handoff['handoff_sha256']
          assert context['spatialruntime_commit_sha']==receipt['spatialruntime_commit_sha']
          assert handoff['spatialruntime_commit_sha']==receipt['spatialruntime_commit_sha']
          print({
              'source_fingerprint': receipt['source_fingerprint'],
              'context_sha256': context['context_sha256'],
              'world_snapshot_revision': context['world_snapshot_revision'],
              'handoff_sha256': handoff['handoff_sha256'],
              'source_commit_sha': upstream_sha,
              'spatialruntime_commit_sha': context['spatialruntime_commit_sha'],
              'exterior_window_keys': context['exterior_window_keys'],
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: live-interior-scene-homeai-consumer
          path: |
            /tmp/interior-world.json
            /tmp/interior-validation.json
            /tmp/interior-handoff.json
            /tmp/interior-homeai-context.json
            /tmp/interior-upstream-sha.txt
