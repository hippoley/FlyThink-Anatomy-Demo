name: deployment-identity-contract

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/deployment_identity.test.cjs"
      - ".github/workflows/deployment-identity-contract.yml"
  workflow_dispatch:

jobs:
  public-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check public deployment identity
        run: node --test tests/deployment_identity.test.cjs
