name: acoustic-asr-e2e

on:
  pull_request:
    paths:
      - "requirements-asr.txt"
      - "scripts/asr_event_protocol.py"
      - "scripts/sherpa_streaming_asr.py"
      - "scripts/sherpa_tts_fixture.py"
      - "scripts/asr_event_bridge.cjs"
      - "scripts/run_acoustic_slu_e2e.cjs"
      - "scripts/run_acoustic_windowpilot_e2e.cjs"
      - "scripts/live_acoustic_windowpilot.py"
      - "scripts/acoustic_fixture_manifest.py"
      - "scripts/acoustic_windowpilot_evidence.cjs"
      - "scripts/verify_acoustic_windowpilot_evidence.cjs"
      - "tests/test_acoustic_fixture_manifest.py"
      - "tests/acoustic_windowpilot_evidence.cjs"
      - "tests/test_live_acoustic_windowpilot_cli.py"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/checkpoint_runtime.py"
      - "scripts/commit_gate.cjs"
      - "tests/test_asr_event_protocol.py"
      - "tests/asr_event_bridge.cjs"
      - ".github/workflows/acoustic-asr-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "requirements-asr.txt"
      - "scripts/asr_event_protocol.py"
      - "scripts/sherpa_streaming_asr.py"
      - "scripts/sherpa_tts_fixture.py"
      - "scripts/asr_event_bridge.cjs"
      - "scripts/run_acoustic_slu_e2e.cjs"
      - "scripts/run_acoustic_windowpilot_e2e.cjs"
      - "scripts/live_acoustic_windowpilot.py"
      - "scripts/acoustic_fixture_manifest.py"
      - "scripts/acoustic_windowpilot_evidence.cjs"
      - "scripts/verify_acoustic_windowpilot_evidence.cjs"
      - "tests/test_acoustic_fixture_manifest.py"
      - "tests/acoustic_windowpilot_evidence.cjs"
      - "tests/test_live_acoustic_windowpilot_cli.py"
      - "scripts/streaming_slu_e2e.cjs"
      - "scripts/checkpoint_runtime.py"
      - "scripts/commit_gate.cjs"
      - "tests/test_asr_event_protocol.py"
      - "tests/asr_event_bridge.cjs"
      - ".github/workflows/acoustic-asr-e2e.yml"
  workflow_dispatch:

jobs:
  acoustic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify provider-neutral ASR event protocol
        run: |
          python -m unittest tests/test_asr_event_protocol.py tests/test_acoustic_fixture_manifest.py tests/test_live_acoustic_windowpilot_cli.py -v
          node tests/asr_event_bridge.cjs
          node tests/acoustic_windowpilot_evidence.cjs
          python -m py_compile scripts/asr_event_protocol.py scripts/acoustic_fixture_manifest.py scripts/sherpa_streaming_asr.py scripts/sherpa_tts_fixture.py scripts/live_acoustic_windowpilot.py
          node --check scripts/asr_event_bridge.cjs
          node --check scripts/acoustic_windowpilot_evidence.cjs
          node --check scripts/verify_acoustic_windowpilot_evidence.cjs
          node --check scripts/run_acoustic_slu_e2e.cjs
          node --check scripts/run_acoustic_windowpilot_e2e.cjs

      - name: Install sherpa acoustic runtime
        run: pip install -r requirements-asr.txt

      - name: Download official 14M Chinese streaming model
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2
          tar xjf sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23.tar.bz2

      - name: Download local Chinese TTS fixture model
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-zh_CN-xiao_ya-medium.tar.bz2
          tar xjf vits-piper-zh_CN-xiao_ya-medium.tar.bz2

      - name: Decode real WAV into revision-aware ASR events
        run: |
          MODEL=sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23
          python scripts/sherpa_streaming_asr.py \
            --wav "$MODEL/test_wavs/0.wav" \
            --tokens "$MODEL/tokens.txt" \
            --encoder "$MODEL/encoder-epoch-99-avg-1.int8.onnx" \
            --decoder "$MODEL/decoder-epoch-99-avg-1.onnx" \
            --joiner "$MODEL/joiner-epoch-99-avg-1.int8.onnx" \
            --stable-repeats 2 \
            > acoustic-events.jsonl
          cat acoustic-events.jsonl
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open("acoustic-events.jsonl",encoding="utf-8") if x.strip()]
          assert rows, "no ASR events"
          assert any(x["kind"]=="partial" for x in rows), "no partial ASR event"
          assert any(x["kind"]=="final" for x in rows), "no final ASR event"
          assert all(x["source"]=="sherpa-onnx" for x in rows)
          print({
              "events":len(rows),
              "partial":sum(x["kind"]=="partial" for x in rows),
              "stable":sum(x["kind"]=="stable" for x in rows),
              "final":sum(x["kind"]=="final" for x in rows),
              "final_texts":[x["text"] for x in rows if x["kind"]=="final"],
          })
          PY

      - name: Generate spoken home-command WAV locally
        run: |
          python scripts/sherpa_tts_fixture.py \
            --model-dir vits-piper-zh_CN-xiao_ya-medium \
            --text "打开主卧空调" \
            --out spoken-home-command.wav \
            > spoken-home-command-fixture.json
          cat spoken-home-command-fixture.json
          python - <<'PY'
          import json, wave
          x=json.load(open("spoken-home-command-fixture.json",encoding="utf-8"))
          assert x["text"]=="打开主卧空调"
          assert x["samples"]>0
          assert x["duration_ms"]>100
          with wave.open("spoken-home-command.wav","rb") as wf:
              assert wf.getnchannels()==1
              assert wf.getsampwidth()==2
              assert wf.getnframes()>0
          print({
              "fixture":"spoken-home-command.wav",
              "sample_rate":x["sample_rate"],
              "duration_ms":x["duration_ms"],
          })
          PY

      - name: Freeze spoken home-command acoustic manifest
        run: |
          python scripts/acoustic_fixture_manifest.py create \
            --wav spoken-home-command.wav \
            --source-kind local_tts \
            --expected-text "打开主卧空调" \
            --provenance-note "deterministic sherpa local TTS fixture" \
            --max-cer 0.25 \
            --out spoken-home-command.manifest.json
          python scripts/acoustic_fixture_manifest.py verify \
            --wav spoken-home-command.wav \
            --manifest spoken-home-command.manifest.json \
            --require-source-kind local_tts

      - name: Decode spoken home command through streaming ASR
        run: |
          MODEL=sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23
          python scripts/sherpa_streaming_asr.py \
            --wav spoken-home-command.wav \
            --tokens "$MODEL/tokens.txt" \
            --encoder "$MODEL/encoder-epoch-99-avg-1.int8.onnx" \
            --decoder "$MODEL/decoder-epoch-99-avg-1.onnx" \
            --joiner "$MODEL/joiner-epoch-99-avg-1.int8.onnx" \
            --stable-repeats 2 \
            > spoken-home-command-events.jsonl
          cat spoken-home-command-events.jsonl
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open("spoken-home-command-events.jsonl",encoding="utf-8") if x.strip()]
          assert rows, "no home-command ASR events"
          assert any(x["kind"]=="partial" for x in rows), "no home-command partial event"
          finals=[x for x in rows if x["kind"]=="final"]
          assert finals, "no home-command final event"
          print({
              "events":len(rows),
              "partials":sum(x["kind"]=="partial" for x in rows),
              "stable":sum(x["kind"]=="stable" for x in rows),
              "final_texts":[x["text"] for x in finals],
          })
          PY
          node - <<'NODE'
          const fs=require("fs");
          const {characterErrorRate}=require("./scripts/acoustic_windowpilot_evidence.cjs");
          const rows=fs.readFileSync("spoken-home-command-events.jsonl","utf8")
            .split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const finals=rows.filter(x=>x.kind==="final");
          if(finals.length!==1)throw new Error("expected one spoken-home final");
          const expected="打开主卧空调";
          const actual=finals[0].text;
          const cer=characterErrorRate(expected,actual);
          if(cer==null||cer>0.25){
            throw new Error("spoken-home acoustic CER exceeds 0.25: "+cer);
          }
          console.log({expected,actual,cer,max_cer:0.25});
          NODE

      - name: Install semantic checkpoint runtime
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download judgement checkpoint
        uses: actions/download-artifact@v4
        with:
          name: context-judgement-v3
          path: artifacts/context-judgement-v3
          github-token: ${{ github.token }}
          run-id: "36372167785"

      - name: Download semantic checkpoint
        uses: actions/download-artifact@v4
        with:
          name: semantic-patch-v1
          path: artifacts/semantic-patch-v1
          github-token: ${{ github.token }}
          run-id: "36372786282"

      - name: Build runtime context
        run: |
          python scripts/train_flywire.py --download --epochs 1 --out artifacts/flywire
          python scripts/build_capability_index.py
          python scripts/generate_long_trajectory_benchmark_v2.py --count 1 --out benchmarks/acoustic-runtime.json

      - name: Real PCM -> sherpa -> checkpoint SLU -> commit gate
        run: |
          cat acoustic-events.jsonl | node scripts/run_acoustic_slu_e2e.cjs \
            --benchmark benchmarks/acoustic-runtime.json \
            --graph artifacts/flywire/connectome.json \
            --judgement artifacts/context-judgement-v3/model.pt \
            --semantic artifacts/semantic-patch-v1/model.pt \
            > acoustic-slu-e2e.json
          cat acoustic-slu-e2e.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("acoustic-slu-e2e.json","utf8"));
          if(x.asr_events<1)throw new Error("no ASR events entered SLU runtime");
          if(x.final_segments<1)throw new Error("no final acoustic segment entered SLU runtime");
          if(x.speculative_physical_commands!==0){
            throw new Error("partial/stable acoustic hypothesis reached physical driver");
          }
          if(x.physical_commands!==0){
            throw new Error("non-home acoustic fixture unexpectedly actuated a device");
          }
          console.log({
            truth:x.truth,
            asr_events:x.asr_events,
            final_segments:x.final_segments,
            speculative_physical_commands:x.speculative_physical_commands,
            physical_commands:x.physical_commands
          });
          NODE

      - name: Spoken home command -> checkpoint SLU -> Thing Model -> feedback reconcile
        run: |
          cat spoken-home-command-events.jsonl | node scripts/run_acoustic_slu_e2e.cjs \
            --benchmark benchmarks/acoustic-runtime.json \
            --graph artifacts/flywire/connectome.json \
            --judgement artifacts/context-judgement-v3/model.pt \
            --semantic artifacts/semantic-patch-v1/model.pt \
            > spoken-home-command-e2e.json
          cat spoken-home-command-e2e.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("spoken-home-command-e2e.json","utf8"));
          const device=x.runtime&&x.runtime.devices&&x.runtime.devices["主卧::空调::default"];
          const finals=(x.trace||[]).filter(t=>t.asr&&t.asr.is_final);
          const committed=finals.filter(t=>t.committed);
          const targets=committed.flatMap(t=>(t.target_resolution&&t.target_resolution.targets)||[]);
          if(x.asr_events<1)throw new Error("no positive acoustic ASR events");
          if(x.final_segments<1)throw new Error("no positive acoustic final segment");
          if(x.speculative_physical_commands!==0){
            throw new Error("positive acoustic partial/stable hypothesis reached physical driver");
          }
          if(x.physical_commands!==1){
            throw new Error("expected exactly one positive acoustic physical command, got "+x.physical_commands);
          }
          if(committed.length!==1)throw new Error("expected exactly one committed final acoustic turn");
          if(!targets.some(t=>t.area==="主卧"&&t.entity==="空调")){
            throw new Error("positive acoustic command resolved wrong target");
          }
          if(!device||device.slots.power!=="ON"){
            throw new Error("positive acoustic command did not reconcile main-bedroom AC power ON");
          }
          const feedback=committed[0].feedback||[];
          if(!feedback.length||feedback[0].slots.power!=="ON"){
            throw new Error("positive acoustic command missing reconciled device feedback");
          }
          console.log({
            truth:x.truth,
            final_text:committed[0].asr.text,
            target:targets[0],
            power:device.slots.power,
            speculative_physical_commands:x.speculative_physical_commands,
            physical_commands:x.physical_commands
          });
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-asr-e2e
          path: |
            acoustic-events.jsonl
            acoustic-slu-e2e.json
            spoken-home-command.wav
            spoken-home-command-fixture.json
            spoken-home-command.manifest.json
            spoken-home-command-events.jsonl
            spoken-home-command-e2e.json
